<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="340" viewBox="0 0 1600 340" font-family="Figtree, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="soft2" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#000000" flood-opacity="0.09"/>
    </filter>
  </defs>

  <rect width="1600" height="340" fill="#F5F5F7"/>

  <text x="800" y="70" text-anchor="middle" font-size="34" font-weight="800" fill="#1D1D1F" letter-spacing="-0.8">Le cycle de vie d'une commande</text>

  <!-- baseline -->
  <line x1="230" y1="196" x2="1370" y2="196" stroke="#1D1D1F" stroke-opacity="0.12" stroke-width="3"/>

  <!-- 1 En attente -->
  <circle cx="230" cy="196" r="15" fill="#AEAEB2"/>
  <rect x="112" y="238" width="236" height="52" rx="26" fill="#FFFFFF" stroke="#AEAEB2" stroke-opacity="0.45" stroke-width="2" filter="url(#soft2)"/>
  <text x="230" y="271" text-anchor="middle" font-size="20" font-weight="700" fill="#6E6E73">En attente</text>

  <!-- 2 En préparation -->
  <circle cx="610" cy="196" r="15" fill="#FF9F0A"/>
  <rect x="480" y="238" width="260" height="52" rx="26" fill="#FFF4E3" stroke="#FF9F0A" stroke-opacity="0.5" stroke-width="2" filter="url(#soft2)"/>
  <text x="610" y="271" text-anchor="middle" font-size="20" font-weight="700" fill="#C77700">En préparation</text>

  <!-- 3 Prête -->
  <circle cx="990" cy="196" r="19" fill="#34C759"/>
  <rect x="872" y="238" width="236" height="52" rx="26" fill="#E6F8EC" stroke="#34C759" stroke-opacity="0.55" stroke-width="2" filter="url(#soft2)"/>
  <text x="990" y="271" text-anchor="middle" font-size="20" font-weight="800" fill="#1E9E44">Prête ✓</text>
  <text x="990" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#1E9E44">Le client est notifié</text>

  <!-- 4 Servie -->
  <circle cx="1370" cy="196" r="15" fill="#AEAEB2"/>
  <rect x="1252" y="238" width="236" height="52" rx="26" fill="#FFFFFF" stroke="#AEAEB2" stroke-opacity="0.45" stroke-width="2" filter="url(#soft2)"/>
  <text x="1370" y="271" text-anchor="middle" font-size="20" font-weight="700" fill="#6E6E73">Servie</text>
</svg>
