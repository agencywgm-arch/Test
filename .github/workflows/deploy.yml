name: Deploy VelvetGuest to GitHub Pages

on:
  push:
    branches: [claude/hopeful-galileo-1o4Hi]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: velvetguest/package-lock.json

      - name: Install dependencies
        working-directory: velvetguest
        run: npm ci

      - name: Build
        working-directory: velvetguest
        env:
          VITE_SUPABASE_URL: https://vugscppmartquxqbsryl.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ1Z3NjcHBtYXJ0cXV4cWJzcnlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNjUxNTMsImV4cCI6MjA5NTY0MTE1M30.FvGfjQpDAWUpL7OzOaRh9SW0pnSnuDSoMBzIzQKKSUk
        run: npm run build

      - name: SPA routing fix (404 → index)
        run: cp velvetguest/dist/index.html velvetguest/dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: velvetguest/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
