name: Deploy VelvetGuest to GitHub Pages

on:
  push:
    branches: [claude/hopeful-galileo-1o4Hi]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: velvetguest/package-lock.json

      - name: Install dependencies
        working-directory: velvetguest
        run: npm ci

      - name: Build
        working-directory: velvetguest
        env:
          VITE_SUPABASE_URL: https://vugscppmartquxqbsryl.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ1Z3NjcHBtYXJ0cXV4cWJzcnlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNjUxNTMsImV4cCI6MjA5NTY0MTE1M30.FvGfjQpDAWUpL7OzOaRh9SW0pnSnuDSoMBzIzQKKSUk
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          VITE_BASE_PATH: /Test/
        run: npm run build

      - name: SPA routing fix
        run: cp velvetguest/dist/index.html velvetguest/dist/404.html

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: velvetguest/dist
          force_orphan: true
